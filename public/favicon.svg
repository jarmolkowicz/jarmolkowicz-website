<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="3" fill="#0d0d0b"/>
  <defs>
    <clipPath id="vp">
      <circle cx="11" cy="16" r="10"/>
    </clipPath>
  </defs>
  <!-- Ghost circles -->
  <circle cx="11" cy="16" r="10" stroke="#e8a020" stroke-width="1" fill="none" opacity="0.3"/>
  <circle cx="21" cy="16" r="10" stroke="#e8a020" stroke-width="1" fill="none" opacity="0.3"/>
  <!-- Lens (intersection) -->
  <circle cx="21" cy="16" r="10" fill="#e8a020" clip-path="url(#vp)"/>
</svg>
